<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Painel Sondagem Serabi</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #061f32;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    img {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
    }
  </style>
</head>

<body>

  <img id="painel" src="painel.png">

  <script>
    const imagens = [
      "painel.png",
      "painel2.png",
      "painel3.png"
    ];

    let atual = 0;

    function mostrarPainel() {
      const imagem = document.getElementById("painel");

      imagem.src =
        imagens[atual] + "?t=" + Date.now();

      atual = (atual + 1) % imagens.length;
    }

    // Troca de painel a cada 30 segundos
    setInterval(mostrarPainel, 30000);

    // Atualiza imediatamente ao abrir
    mostrarPainel();
  </script>

</body>
</html>
